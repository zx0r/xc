[package]
name = "xc"
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.99.0"
repository = "https://github.com/zx0r/xc"
description = "Ultra fast shell history engine"
homepage = "https://github.com/zx0r/xc#readme"
authors = ["zx0r <admin@xxxx.dev>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["history", "shell", "cli", "dotfiles"]
autobenches = false

# Strict Source Ingestion Boundary: Whitelists strictly pure Rust sources & manifest
include = [
  "src/**/*.rs",
  "tests/**/*.rs",
  "benches/**/*.rs",
  "Cargo.toml",
  "README.md",
  "LICENSE*",
]

[package.metadata.dist]
dist = true

[dependencies]
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = [
  "crossterm",
] }
memmap2 = "0.9.12"
nucleo-matcher = "0.3.1"
tree-sitter = "0.27.2"
tree-sitter-bash = "0.25.1"
rayon = "1.12.0"
memchr = "2.8.3"
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"
criterion = { version = "0.8.2", default-features = false }
assert_cmd = "2.2.2"
predicates = "3.1.4"

[[bench]]
name = "search_bench"
harness = false

[[bench]]
name = "bench_scale"
harness = false

[[bench]]
name = "bench_comparative"
harness = false

[profile.dist]
inherits = "release"
lto = "fat"

[profile.dev]
opt-level = 0
debug = 2
split-debuginfo = "unpacked"
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 3

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
panic = "unwind"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"
strip = true
incremental = false
codegen-units = 1

[profile.test]
inherits = "dev"
debug = 1
overflow-checks = true
split-debuginfo = "unpacked"

[profile.bench]
inherits = "release"
debug = true
opt-level = 3
lto = "thin"

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
multiple_unsafe_ops_per_block = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
inline_always = "warn"
needless_pass_by_value = "warn"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
